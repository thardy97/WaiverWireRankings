<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waiver Wire Ranker</title>
<style>
:root{--bg:#f1f4f9;--fg:#14202e;--mut:#5b6879;--line:#d5dce6;--acc:#1d5fd1;--card:#fff;--hl:#e6eefb}
@media(prefers-color-scheme:dark){:root{--bg:#101620;--fg:#e8eef7;--mut:#93a1b5;--line:#263143;--acc:#3b7de8;--card:#18202c;--hl:#1f2c40}}
*{box-sizing:border-box}
body{margin:0 auto;max-width:1400px;padding:20px 16px 60px;background:var(--bg);color:var(--fg);font:15px/1.45 ui-sans-serif,system-ui,sans-serif}
h2{font-size:16px;margin:8px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.cols section{min-width:0}
@media(max-width:1000px){.cols{grid-template-columns:1fr}}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
p.sub{margin:0 0 18px;color:var(--mut)}
form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input,button,select{font:inherit;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:9px 12px}
input#user{flex:1;min-width:180px}input#season{width:84px}
button{cursor:pointer}button.go{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.bar button{padding:6px 12px;border-radius:99px}
.bar button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#leagues button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.note{color:var(--mut);font-size:13px;margin:8px 0}
.err{color:#b42318;font-weight:600}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;white-space:nowrap}
th,td{padding:6px 9px;font-size:13px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card)}
td.p{font-weight:600}
tr:last-child td{border-bottom:0}
tr:nth-child(even) td{background:var(--hl)}
.more{margin:12px 0}
#stamp button{padding:4px 10px;margin-left:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 0}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 14px;font-weight:600;color:var(--mut)}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.best{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.best div{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font-size:13px}
.best span{display:block;color:var(--mut);font-size:11px}
.pw tr:nth-child(even) td{background:transparent}
.pw tr.me td{background:var(--hl)}
.pw td.c{text-align:center}.pw th.c{text-align:center}
.pw td.r1{color:var(--acc);font-weight:700}
.pw td.r1 b{font-size:14px}
.sc{color:var(--mut);font-size:11px;margin-left:5px;font-weight:400}
.srt,.tm{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.srt{font-weight:600}.srt.on{color:var(--acc)}
.tm{font-weight:600}
.pw tr.det td{white-space:normal;background:var(--card)!important;font-size:13px}
.pw tr.det div{margin:3px 0}
</style></head>
<body>
<h1>Waiver Wire Ranker</h1>
<p class="sub">Enter a Sleeper username to see the best available players in each of your leagues, ranked best to worst.</p>
<form id="f">
  <input id="user" placeholder="Sleeper username" autocomplete="off" required>
  <input id="season" value="2026" aria-label="Season" inputmode="numeric">
  <button class="go">Find players</button>
</form>
<div class="note" id="rk"></div>
<div class="note err" id="warn"></div>
<div class="note" id="stamp"></div>
<div id="msg" class="note"></div>
<div class="tabs" id="tabs"></div>
<div class="bar" id="leagues"></div>
<div class="bar" id="pos"></div>
<div id="out"></div>
<div class="note" id="miss"></div>

<script>
const $=id=>document.getElementById(id),API='https://api.sleeper.app/v1';
let ranks=[],cols=[],players={},idx={},rankById={},leagues=[],cur=0,pos='ALL',limit=50;

const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
const read=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
function storageOK(){try{localStorage.setItem('sl_test','1');const ok=localStorage.getItem('sl_test')=='1';localStorage.removeItem('sl_test');return ok}catch(e){return false}}
const noSave=()=>{$('warn').textContent="This browser can't save data here (private window, blocked site data, or an embedded preview), so your username, leagues and rankings won't be remembered. Open the page in a normal browser tab to use saving."};

const j=async u=>{const r=await fetch(API+u);if(!r.ok)throw new Error('Sleeper returned '+r.status);return r.json()};
const norm=s=>s.toLowerCase().replace(/[^a-z\s]/g,'').replace(/\b(jr|sr|ii|iii|iv|v)\b/g,'').replace(/\s+/g,' ').trim();

function parseCSV(t){
  t=t.replace(/^\uFEFF/,'');const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;
    else if(ch==','){r.push(c);c=''}
    else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.length>1||r[0])rows.push(r);r=[]}
    else c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}
  const h=rows.shift().map(x=>x.trim());cols=h;
  return rows.map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||'').trim()])));
}

function setRanks(text,label,keep){
  const pr=ranks,pc=cols;
  try{
    ranks=parseCSV(text);
    if(!cols.includes('Player')||!cols.includes('Position'))throw new Error('That CSV needs "Player" and "Position" columns. Headers found: '+cols.join(', '));
  }catch(e){ranks=pr;cols=pc;throw e}
  if(!keep&&!save('sl_csv',{text,label}))noSave();
  rkLine(label);
}

function rkLine(label){
  const rk=$('rk');
  rk.textContent=label?ranks.length+' ranked players loaded ('+label+'). ':'Upload your rankings CSV to get started. ';
  rk.appendChild(picker(label?'Upload a different CSV':'Upload rankings CSV'));
}

function picker(text){
  const l=document.createElement('label');
  l.innerHTML='<u style="cursor:pointer">'+text+'</u><input type="file" accept=".csv" hidden>';
  l.querySelector('input').onchange=e=>pick(e.target.files[0]);
  return l;
}

async function pick(f){
  if(!f)return;
  try{setRanks(await f.text(),f.name)}
  catch(e){$('msg').className='note err';$('msg').textContent=e.message;return}
  $('msg').textContent='';
  if(leagues.length){match();render()}else restore();
}

function loadRanks(){
  const sv=read('sl_csv');
  if(sv&&sv.text){try{setRanks(sv.text,sv.label,true);return}catch(e){}}
  rkLine('');
}

async function loadPlayers(){
  const c=read('sl_players');if(c&&c.d&&Date.now()-c.t<864e5)return c.d;
  const all=await j('/players/nfl'),d={};
  for(const [id,p] of Object.entries(all)){
    if(!(p.team||p.active)||!p.first_name||!['QB','RB','WR','TE','K'].includes(p.position))continue;
    d[id]=[p.first_name+' '+p.last_name,p.position,p.team];
  }
  save('sl_players',{t:Date.now(),d});
  return d;
}

function match(){
  idx={};
  for(const id in players)(idx[norm(players[id][0])]??=[]).push(id);
  for(const r of ranks){
    const ids=idx[norm(r.Player||'')]||[];
    r._id=ids.find(i=>players[i][1]==r.Position&&players[i][2]==r.Team)||ids.find(i=>players[i][1]==r.Position)||ids[0]||null;
  }
  rankById={};ranks.forEach((r,i)=>{r._n=i+1;if(r._id)rankById[r._id]=r});
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tab='waivers',sortKey='Total',openTeam=null;

async function load(u,s){
  $('msg').className='note';$('msg').textContent='Loading leagues…';
  ['out','leagues','pos','tabs','stamp'].forEach(i=>$(i).innerHTML='');$('miss').textContent='';
  try{
    if(!ranks.length)throw new Error('Upload your rankings CSV first.');
    const [user,pl]=await Promise.all([j('/user/'+encodeURIComponent(u)),loadPlayers()]);
    if(!user)throw new Error('No Sleeper user named "'+u+'".');
    players=pl;
    const ls=await j('/user/'+user.user_id+'/leagues/nfl/'+s);
    if(!ls.length)throw new Error('No leagues found for '+u+' in '+s+'.');
    const data=await Promise.all(ls.map(async l=>{
      const [rs,us]=await Promise.all([j('/league/'+l.league_id+'/rosters'),j('/league/'+l.league_id+'/users').catch(()=>[])]);
      const nm={};for(const x of us||[])nm[x.user_id]={team:x.metadata&&x.metadata.team_name,owner:x.display_name};
      const teams=rs.map(r=>{const o=nm[r.owner_id]||{};
        return{id:r.roster_id,name:o.team||o.owner||'Team '+r.roster_id,owner:o.owner||'',
          me:r.owner_id==user.user_id||(r.co_owners||[]).includes(user.user_id),
          players:[...new Set([...(r.players||[]),...(r.reserve||[]),...(r.taxi||[])])]}});
      return{name:l.name,slots:l.roster_positions||[],teams};
    }));
    const t=Date.now();
    if(!save('sl_data',{v:2,u,s,t,data}))noSave();
    show(data,t,u,s);
  }catch(err){$('msg').className='note err';$('msg').textContent=err.message}
}

function show(data,t,u,s){
  leagues=data.map(l=>({...l,taken:new Set(l.teams.flatMap(x=>x.players)),mine:(l.teams.find(x=>x.me)||{players:[]}).players}));
  match();cur=0;pos='ALL';limit=50;openTeam=null;$('msg').textContent='';
  $('stamp').innerHTML='';
  const sp=document.createElement('span'),b=document.createElement('button');
  sp.textContent=u+' · '+s+' · leagues updated '+new Date(t).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  b.textContent='Refresh leagues';b.onclick=()=>load(u,s);
  $('stamp').append(sp,b);
  render();
}

async function restore(){
  const c=read('sl_data');
  if(!c||!c.data)return;
  $('user').value=c.u;$('season').value=c.s;
  if(!ranks.length){$('msg').className='note';$('msg').textContent='Saved leagues found for '+c.u+'. Upload your rankings CSV above to view them.';return}
  if(c.v!==2){load(c.u,c.s);return}
  try{players=await loadPlayers();show(c.data,c.t,c.u,c.s)}
  catch(err){$('msg').className='note err';$('msg').textContent='Could not load saved leagues: '+err.message}
}

$('f').onsubmit=e=>{e.preventDefault();load($('user').value.trim(),$('season').value.trim())};

function render(){
  $('tabs').innerHTML='';
  [['waivers','Waiver wire'],['power','League rankings']].forEach(([k,t])=>{const b=document.createElement('button');b.textContent=t;b.className=k==tab?'on':'';
    b.onclick=()=>{tab=k;render()};$('tabs').appendChild(b)});
  $('leagues').innerHTML='';
  leagues.forEach((l,i)=>{const b=document.createElement('button');b.textContent=l.name;b.className=i==cur?'on':'';
    b.onclick=()=>{cur=i;limit=50;openTeam=null;render()};$('leagues').appendChild(b)});
  $('pos').innerHTML='';
  if(tab=='waivers')renderWaivers();else renderPower();
  const miss=ranks.filter(r=>!r._id).map(r=>r.Player);
  $('miss').textContent=miss.length?miss.length+' ranked players not matched to Sleeper: '+miss.slice(0,8).join(', ')+(miss.length>8?'…':''):'';
}

function renderWaivers(){
  ['ALL',...new Set(ranks.map(r=>r.Position).filter(Boolean))].forEach(p=>{const b=document.createElement('button');b.textContent=p;b.className=p==pos?'on':'';
    b.onclick=()=>{pos=p;limit=50;render()};$('pos').appendChild(b)});
  const L=leagues[cur],ok=r=>pos=='ALL'||r.Position==pos;
  const tbl=rs=>'<div class="wrap"><table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+
    rs.map(r=>'<tr>'+cols.map(c=>'<td'+(c=='Player'?' class="p"':'')+'>'+esc(r[c]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  const mine=L.mine.map(id=>{const r=rankById[id],p=players[id];
    return r||(p?{Player:p[0],Position:p[1],Team:p[2],_n:1e9}:{Player:id,Position:'DEF',Team:id,_n:1e9})}).filter(ok).sort((a,b)=>a._n-b._n);
  const all=ranks.filter(r=>r._id&&!L.taken.has(r._id)&&ok(r)),rows=all.slice(0,limit);
  $('out').innerHTML='<div class="cols"><section><h2>Your roster ('+mine.length+')</h2>'+
    (L.mine.length?tbl(mine):'<p class="note">Could not find this user\'s roster in this league.</p>')+'</section>'+
    '<section><h2>Available players</h2>'+tbl(rows)+
    (all.length>limit?'<button class="more" id="more">Show 50 more ('+(all.length-limit)+' left)</button>':'')+
    (all.length?'':'<p class="note">No available ranked players for this filter.</p>')+'</section></div>';
  if($('more'))$('more').onclick=()=>{limit+=50;render()};
}

const FLEX={FLEX:['RB','WR','TE'],WRRB_FLEX:['RB','WR'],REC_FLEX:['WR','TE'],SUPER_FLEX:['QB','RB','WR','TE']};

function strength(L){
  const ps=new Set(ranks.map(r=>r.Position)),N=ranks.length;
  const val=id=>{const r=rankById[id];return r?100*Math.pow((N-r._n+1)/N,2):0};
  let fixed={},flex=[];
  for(const s of L.slots){if(FLEX[s])flex.push(s);else if(ps.has(s))fixed[s]=(fixed[s]||0)+1}
  if(!Object.keys(fixed).length&&!flex.length){for(const [k,n] of [['QB',1],['RB',2],['WR',2],['TE',1]])if(ps.has(k))fixed[k]=n;flex=['FLEX']}
  flex.sort((a,b)=>FLEX[a].length-FLEX[b].length);
  const G=Object.keys(fixed);if(flex.length)G.push('Flex');
  const teams=L.teams.map(t=>{
    const pl=t.players.filter(id=>rankById[id]).sort((a,b)=>rankById[a]._n-rankById[b]._n),used=new Set(),g={};
    for(const p of Object.keys(fixed)){g[p]=[];for(const id of pl){if(g[p].length>=fixed[p])break;if(!used.has(id)&&rankById[id].Position==p){used.add(id);g[p].push(id)}}}
    if(flex.length){g.Flex=[];for(const s of flex){const id=pl.find(i=>!used.has(i)&&FLEX[s].includes(rankById[i].Position));if(id){used.add(id);g.Flex.push(id)}}}
    const bench=pl.filter(i=>!used.has(i)).slice(0,5),sc={};let tot=0;
    for(const k of G){sc[k]=g[k].reduce((a,id)=>a+val(id),0);tot+=sc[k]}
    sc.Total=tot;sc.Depth=bench.reduce((a,id)=>a+val(id),0);
    return{...t,g,bench,sc,rk:{}};
  });
  for(const k of [...G,'Total','Depth']){
    const so=[...teams].sort((a,b)=>b.sc[k]-a.sc[k]);
    so.forEach((t,i)=>{t.rk[k]=i&&t.sc[k]==so[i-1].sc[k]?so[i-1].rk[k]:i+1});
  }
  return{G,teams};
}

function renderPower(){
  const L=leagues[cur],{G,teams:T}=strength(L);
  if(!T.length){$('out').innerHTML='<p class="note">No teams found for this league.</p>';return}
  const keys=[...G,'Depth'],n=T.length,sk=keys.includes(sortKey)?sortKey:'Total',me=T.find(t=>t.me);
  const nm=t=>esc(t.name)+(t.owner&&t.owner!=t.name?' <span class="sc">'+esc(t.owner)+'</span>':'');
  const pn=id=>{const r=rankById[id];return esc(players[id]?players[id][0]:id)+'<span class="sc">#'+esc(r.Overall||r._n)+'</span>'};
  const lead=k=>[...T].sort((a,b)=>b.sc[k]-a.sc[k])[0];
  const rows=[...T].sort((a,b)=>b.sc[sk]-a.sc[sk]||b.sc.Total-a.sc.Total);
  const th=(k,t)=>'<th class="c"><button class="srt'+(k==sk?' on':'')+'" data-k="'+k+'">'+t+(k==sk?' ▼':'')+'</button></th>';
  const cell=(t,k)=>'<td class="c'+(t.rk[k]==1?' r1':'')+'"><b>#'+t.rk[k]+'</b><span class="sc">'+Math.round(t.sc[k])+'</span></td>';
  const best=[['Best team overall',lead('Total')],...G.map(k=>['Strongest '+k,lead(k)])]
    .map(([l,t])=>'<div><span>'+esc(l)+'</span><b>'+esc(t.name)+'</b>'+(t.me?' (you)':'')+'</div>').join('');
  let you='';
  if(me){const gs=[...G].sort((a,b)=>me.rk[a]-me.rk[b]);
    you='<p class="note">You are #'+me.rk.Total+' of '+n+' overall. Strongest group: <b>'+gs[0]+'</b> (#'+me.rk[gs[0]]+'). Weakest: <b>'+gs[gs.length-1]+'</b> (#'+me.rk[gs[gs.length-1]]+').</p>'}
  const body=rows.map(t=>{
    let h='<tr'+(t.me?' class="me"':'')+'><td class="c">'+t.rk.Total+'</td><td><button class="tm" data-id="'+t.id+'">'+nm(t)+(t.me?' (you)':'')+'</button></td>'+
      cell(t,'Total')+keys.map(k=>cell(t,k)).join('')+'</tr>';
    if(openTeam==t.id)h+='<tr class="det"><td colspan="'+(keys.length+3)+'">'+
      G.map(k=>'<div><b>'+k+':</b> '+(t.g[k].length?t.g[k].map(pn).join(', '):'none')+'</div>').join('')+
      '<div><b>Bench:</b> '+(t.bench.length?t.bench.map(pn).join(', '):'none')+'</div></td></tr>';
    return h}).join('');
  $('out').innerHTML='<div class="best">'+best+'</div>'+you+
    '<div class="wrap"><table class="pw"><thead><tr><th class="c">Rank</th><th>Team</th>'+th('Total','Total')+keys.map(k=>th(k,k)).join('')+'</tr></thead><tbody>'+body+'</tbody></table></div>'+
    '<p class="note">Each player is worth points by overall rank in your CSV (rank 1 is about 100, falling as the rank gets lower; unranked is 0). Teams are scored on their best possible lineup for this league\'s starting slots, and Depth is the top 5 bench players. Each cell shows the team\'s rank in the league for that group, with its score beside it. Click a column to sort, or a team to see its lineup.</p>';
  $('out').querySelectorAll('.srt').forEach(b=>b.onclick=()=>{sortKey=b.dataset.k;renderPower()});
  $('out').querySelectorAll('.tm').forEach(b=>b.onclick=()=>{openTeam=openTeam==b.dataset.id?null:b.dataset.id;renderPower()});
}

if(!storageOK())noSave();
loadRanks();
restore();
</script>
</body></html>
